; PlatformIO project configuration for ESP32-C3 electronic piano
; See README.md for build / flash instructions.

[platformio]
default_envs = esp32c3

; ---------------------------------------------------------------------------
; ESP32-C3 (RISC-V) + Arduino framework
; ---------------------------------------------------------------------------
; We use the default arduino-esp32 that ships with espressif32 7.0.1
; (3.20017.x) and patch the two known framework bugs from the workflow
; before the actual compile step.  Earlier attempts pinned 2.0.18 but
; that version was never published to the platformio registry (only
; 3.x.x and 3.1.x.x are available), so the build failed with
; "UnknownPackageError" before the framework was even downloaded.
;
; USB CDC is mandatory because GPIO20/GPIO21 are reused for PWM
; audio and the LED; the default UART0 would clash. CDC moves the
; serial console to the on-board USB-C port, no extra wiring.
; ---------------------------------------------------------------------------
[env:esp32c3]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino

; 80 MHz flash at QIO matches the bare ESP32-C3FH4 / ESP32-C3FN4 module.
board_build.f_flash = 80000000L
board_build.flash_mode = qio
board_build.partitions = default.csv

; Default baud for `pio run -t monitor` (USB CDC ignores speed, but the
; framework still asks for one).
monitor_speed = 115200
upload_speed = 460800

build_flags =
    -DARDUINO_ESP32C3_DEV
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=3
    -DCONFIG_ESP32C3_TOUCH_ENABLED=1

extra_scripts =
    post:merge_bin.py

; ---------------------------------------------------------------------------
; Tiny sanity-check env that only builds the bare-bones project (no audio
; and no touch HAL) when you want to verify the toolchain quickly.
; ---------------------------------------------------------------------------
[env:esp32c3_minimal]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
board_build.f_flash = 80000000L
board_build.flash_mode = qio
monitor_speed = 115200
build_flags =
    -DARDUINO_ESP32C3_DEV
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=3