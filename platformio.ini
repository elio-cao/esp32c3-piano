; PlatformIO project configuration for ESP32-C3 electronic piano
; See README.md for build / flash instructions.

[platformio]
default_envs = esp32c3

; ---------------------------------------------------------------------------
; ESP32-C3 (RISC-V) + Arduino framework
; ---------------------------------------------------------------------------
; We use the default framework that ships with the espressif32 platform.
;
; IMPORTANT: arduino-esp32 3.20017 (the version that ships with
; espressif32 7.0.1) has TWO bugs that break the build for this
; project on GitHub Actions runners:
;   1. `tools/sdk/esp32c3/include/driver/include/driver/touch_pad.h`
;      #includes `driver/touch_sensor.h` which is an S3-only header
;      and does not exist for the C3 toolchain.
;   2. `cores/esp32/HardwareSerial.cpp` references `Serial` in
;      `serialEventRun()` even when the build is configured to use
;      USB-CDC instead of UART0.
; We work around (1) by avoiding the broken HAL entirely (see keys.cpp,
; which uses `digitalRead()` for all eight keys).  For (2) we do not
; call `Serial.*` from user code.  If you use this project on a
; different framework version where `Serial` is the regular UART0
; object, re-enable the `Serial.print(...)` calls in keys.cpp and
; main.cpp to get debug logs out of the box.
;
; USB CDC is mandatory because GPIO20/GPIO21 are reused for PWM
; audio and the LED; the default UART0 would clash. CDC moves the
; serial console to the on-board USB-C port, no extra wiring.
; ---------------------------------------------------------------------------
[env:esp32c3]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino

; 80 MHz flash at QIO matches the bare ESP32-C3FH4 / ESP32-C3FN4 module.
board_build.f_flash = 80000000L
board_build.flash_mode = qio
board_build.partitions = default.csv

; Default baud for `pio run -t monitor` (USB CDC ignores speed, but the
; framework still asks for one).
monitor_speed = 115200
upload_speed = 460800

build_flags =
    -DARDUINO_ESP32C3_DEV
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=3
    -DCONFIG_ESP32C3_TOUCH_ENABLED=1

; Use the merged single image from merge_bin.py.
board_build.arduino.binary_type = hex

extra_scripts =
    post:merge_bin.py

; ---------------------------------------------------------------------------
; Tiny sanity-check env that only builds the bare-bones project (no audio
; and no touch HAL) when you want to verify the toolchain quickly.
; ---------------------------------------------------------------------------
[env:esp32c3_minimal]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
board_build.f_flash = 80000000L
board_build.flash_mode = qio
monitor_speed = 115200
build_flags =
    -DARDUINO_ESP32C3_DEV
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=3
