name: Build ESP32-C3 piano firmware

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PlatformIO Core
        run: |
          python -m pip install --upgrade pip
          python -m pip install platformio
          pio --version

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini', 'src/**') }}
          restore-keys: |
            pio-${{ runner.os }}-

      # Step 1: trigger a first build that only needs to download
      # the espressif32 platform and its arduino-esp32 framework.
      # The compile will fail (framework bugs), but the framework
      # tarball is unpacked into ~/.platformio/packages/framework-arduinoespressif32
      # so the patch step below has files to operate on.
      - name: Warm-up build (downloads framework, failures are OK)
        run: |
          set +e
          pio run --environment esp32c3
          echo "--- framework dir contents after warm-up ---"
          ls -la ~/.platformio/packages/framework-arduinoespressif32 2>&1 | head -40 || true
          echo "--- look for touch_pad.h ---"
          find ~/.platformio/packages/framework-arduinoespressif32 -name 'touch_pad.h' 2>/dev/null || true
          echo "--- look for HardwareSerial.cpp ---"
          find ~/.platformio/packages/framework-arduinoespressif32 -name 'HardwareSerial.cpp' 2>/dev/null || true
          true   # never fail this step

      # Step 2: patch the two known bugs in arduino-esp32 3.20017.
      #   (a) driver/touch_pad.h  #includes  driver/touch_sensor.h
      #       which is S3-only and absent in the C3 SDK.
      #   (b) HardwareSerial.cpp::serialEventRun references `Serial`
      #       which is not declared under ARDUINO_USB_CDC_ON_BOOT=1.
      - name: Patch framework bugs
        run: |
          set -e
          FRAMEWORK_DIR="$HOME/.platformio/packages/framework-arduinoespressif32"
          if [ ! -d "$FRAMEWORK_DIR" ]; then
            echo "ERROR: framework dir $FRAMEWORK_DIR does not exist after warm-up build"
            exit 1
          fi

          # ----- (a) touch_pad.h broken include -----------------------------
          TOUCH_PAD_H=$(find "$FRAMEWORK_DIR" -name 'touch_pad.h' -path '*esp32c3*' | head -1)
          if [ -z "$TOUCH_PAD_H" ]; then
            TOUCH_PAD_H=$(find "$FRAMEWORK_DIR" -name 'touch_pad.h' | head -1)
          fi
          if [ -n "$TOUCH_PAD_H" ] && [ -f "$TOUCH_PAD_H" ]; then
            echo "Patching touch_pad.h at $TOUCH_PAD_H"
            sed -i 's|^#include "driver/touch_sensor.h"|/* patched: stubbed for ESP32-C3 */ #include "touch_sensor.h"|' "$TOUCH_PAD_H"
            STUB_PATH="$(dirname "$TOUCH_PAD_H")/touch_sensor.h"
            if [ ! -f "$STUB_PATH" ]; then
              cat > "$STUB_PATH" <<'EOF'
          // Stub for ESP32-C3 (arduino-esp32 3.20017 includes this from
          // touch_pad.h even though the S3-only driver/touch_sensor.h is
          // not shipped in the C3 toolchain).  This project does not
          // use the new touch_sensor API; keys.cpp uses digitalRead().
          #pragma once
          #include <stdint.h>
          #include "esp_err.h"
          #define TOUCH_SENSOR_MAX 0
          typedef int touch_sensor_handle_t;
          static inline esp_err_t touch_sensor_init(void) { return 0; }
          static inline esp_err_t touch_sensor_config(touch_sensor_handle_t h, void* c) { (void)h; (void)c; return 0; }
          static inline esp_err_t touch_sensor_read(touch_sensor_handle_t h, uint32_t* v) { (void)h; (void)v; return 0; }
          EOF
            fi
            echo "  - patched."
          else
            echo "WARN: touch_pad.h not found - skipping patch (a)"
          fi

          # ----- (b) HardwareSerial.cpp serialEventRun references Serial ----
          HW_SERIAL_CPP=$(find "$FRAMEWORK_DIR" -name 'HardwareSerial.cpp' | head -1)
          if [ -n "$HW_SERIAL_CPP" ] && [ -f "$HW_SERIAL_CPP" ]; then
            echo "Patching HardwareSerial.cpp at $HW_SERIAL_CPP"
            sed -i 's|if(serialEvent \&\& Serial\.available()) serialEvent();|/* patched: no Serial in CDC mode */ if (0) {}|' "$HW_SERIAL_CPP"
            echo "  - patched."
          else
            echo "WARN: HardwareSerial.cpp not found - skipping patch (b)"
          fi

      # Step 3: real build using the now-patched framework.
      - name: Build firmware (PIO + merge_bin.py)
        run: pio run --environment esp32c3

      - name: Verify merged image with esptool
        run: |
          python -m pip install esptool
          python -m esptool image-info dist/firmware.bin

      - name: Upload merged firmware.bin
        uses: actions/upload-artifact@v4
        with:
          name: piano-firmware
          path: dist/firmware.bin
          if-no-files-found: error
          retention-days: 14
